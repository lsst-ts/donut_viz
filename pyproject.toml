[build-system]
requires = ["setuptools>=45", "setuptools-scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "donut_viz"
description = "Rubin Observatory donut visualization tasks and pipelines"
license = { text = "GPL" }
classifiers = [ "Programming Language :: Python :: 3" ]
dependencies = ["pymodbus"]
readme = "README.rst"
urls = { documentation = "https://donut-viz.lsst.io", source_code = "https://github.com/lsst-ts/donut_viz"}
dynamic = ["version"]

[tool.setuptools.dynamic]
version = { attr = "setuptools_scm.get_version" }

[tool.setuptools.packages.find]
where = [ "python" ]

[project.scripts]
createIntrinsicZernikes = "lsst.donut.viz.create_intrinsic_zernikes:createIntrinsicZernikes"

[tool.setuptools_scm]
write_to = "python/lsst/donut/viz/version.py"
write_to_template = """
# Generated by setuptools_scm
__all__ = ["__version__"]
__version__ = "{version}"
"""

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-vsx --capture=no"
log_cli_level = "DEBUG"

[project.optional-dependencies]
dev = ["documenteer[pipelines]"]
