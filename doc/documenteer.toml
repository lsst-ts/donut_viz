
# This template contains enough information for documenteer to build

[project]
# The title of the index page.
title = "donut_viz" # i.e. CBP
# Copyright information displayed on the footer of each page
copyright = "2019-2026 Association of Universities for Research in Astronomy, Inc. (AURA)"
github_url = "https://github.com/lsst-ts/donut_viz"

[project.python]
# pyproject.toml package name, fills out unseen metadata
package = "donut_viz" # i.e. ts_cbp (should match the name that importlib.metadata uses/pyproject.toml name)
documentation_url_key = "documentation"
github_url_key = "source_code"

[sphinx]
extensions = [
  "sphinxcontrib.mermaid",
  "sphinx_automodapi.automodapi",
]

[sphinx.intersphinx.projects]
ts-wep = "https://ts-wep.lsst.io"
python = "https://docs.python.org/3.13/"
