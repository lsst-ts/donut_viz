description: >
  rapid analysis pipeline for LSSTCam CWFS using the AiDonut algorithm,
  configured for USDF reprocessing. The AiDonut task configuration and model
  are inherited from the production blueprint; the granular step layout lets
  step1b onward reuse the donut stamps produced by step1a of an earlier run.
instrument: lsst.obs.lsst.LsstCam
imports:
  - location: $DONUT_VIZ_DIR/pipelines/production/lsstCamRapidAnalysisPipeline_AiDonut_Bin2x_unpaired.yaml
    exclude:
      - plotAOSTask
      - plotDonutUnpairedCwfsTask
      - plotDonutFitsUnpairedTask
tasks:
  generateDonutDirectDetectTask:
    class: lsst.ts.wep.task.generateDonutDirectDetectTask.GenerateDonutDirectDetectTask
    config:
      donutSelector.sourceLimit: 40
  calcZernikesUnpairedTask:
    class: lsst.ts.wep.task.calcZernikesUnpairedTask.CalcZernikesUnpairedTask
    config:
      connections.donutStamps: donutStampsCwfs
      donutStampSelector.maxSelect: 20
  aggregateDonutStampsUnpairedTask:
    class: lsst.donut.viz.AggregateDonutStampsUnpairedTask
    config:
      maxDonutsPerDetector: 20


# Define pipeline steps
subsets:
  step1a-detectors:
    subset:
      - isr
      - generateDonutDirectDetectTask
      - generateDonutFromRefitWcsTask
      - cutOutDonutsCwfsPairTask
    description: |
      This step processes the input images with ISR,
      finds and cuts out the donut stamps. Its outputs (the donut
      stamps) can be reused as inputs to step1b of a later AiDonut run.
  step1b-detectors:
    subset:
      - calcZernikesUnpairedTask
    description: |
      Estimate the Zernike coefficients from unpaired donuts using the
      AiDonut algorithm. Reuses the donut stamps produced by step1a.
  step2-visits:
    subset:
      - aggregateZernikeTablesTask
      - aggregateDonutTablesUnpairedTask
      - aggregateAOSVisitTableUnpairedTask
      - aggregateDonutStampsUnpairedTask
    description: |
      AOS Donut aggregation tasks. This step generates the aggregated
      tables for the AOS visit.

steps:
  - label: step1a-detectors
    dimensions: [visit, detector]
  - label: step1b-detectors
    dimensions: [visit, detector]
  - label: step2-visits
    dimensions: [visit]
